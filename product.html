
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 - 적당히 마켓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 메뉴 -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">적당히 마켓</a>

      <button
        id="menu-btn"
        class="menu-btn"
        type="button"
        aria-label="메뉴 열기"
        aria-expanded="false">
        ☰
      </button>

      <nav id="nav" class="nav">
        <a href="index.html">홈</a>
        <a href="index.html#products" class="active">상품</a>
        <a href="cart.html">장바구니</a>
        <a href="index.html#contact">문의</a>
      </nav>
    </div>
  </header>

  <!-- 상품 상세 -->
  <main class="container detail-container">

    <a href="index.html#products" class="back-link">
      ← 상품 목록으로 돌아가기
    </a>

    <section class="detail" id="detail">

      <div class="detail-image-wrap">
        <img id="p-image" class="detail-image" src="" alt="">
      </div>

      <div class="detail-info">
        <p class="detail-category" id="p-category"></p>

        <h2 id="p-name"></h2>

        <p id="p-price" class="detail-price"></p>

        <p id="p-desc" class="detail-desc"></p>

        <div class="quantity-area">
          <span class="quantity-label">수량</span>

          <div class="quantity">
            <button id="minus" type="button" aria-label="수량 줄이기">−</button>
            <span id="count">1</span>
            <button id="plus" type="button" aria-label="수량 늘리기">+</button>
          </div>
        </div>

        <div class="total-area">
          <span>총 상품 금액</span>
          <strong id="total">0원</strong>
        </div>

        <button id="cart-btn" class="buy-btn big" type="button">
          장바구니 담기
        </button>

      </div>
    </section>

    <p id="not-found" class="not-found" hidden>
      상품을 찾을 수 없습니다.
      <a href="index.html">메인으로 돌아가기</a>
    </p>

  </main>

  <!-- 하단 -->
  <footer class="footer">
    <p>© 2026 적당히 마켓. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script src="products.js"></script>
  <script src="menu.js"></script>
  <script src="product.js"></script>

</body>
</html>
