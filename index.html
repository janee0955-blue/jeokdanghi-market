<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>적당히 마켓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 메뉴 -->
  <header class="header">
    <h1 class="logo">적당히 마켓</h1>

    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="#">상품</a>
      <a href="#">장바구니</a>
      <a href="#">문의</a>
    </nav>
  </header>

  <!-- 메인 배너 -->
  <section class="banner">
    <h2>오늘의 추천 상품</h2>
    <p>적당히 좋은 물건, 적당한 가격에</p>
  </section>

  <!-- 상품 목록 -->
  <main class="container">
    <h2 class="section-title">전체 상품</h2>

    <div class="product-list">

      <!-- 상품 1: 티셔츠 -->
      <div class="product">
        <a href="product.html?id=1">
          <img src="images/면티.jfif" alt="기본 면 티셔츠">
          <h3 class="product-name">기본 면 티셔츠</h3>
        </a>
        <p class="product-price">15,000원</p>
        <button type="button" class="buy-btn">장바구니 담기</button>
      </div>

      <!-- 상품 2: 에코백 -->
      <div class="product">
        <a href="product.html?id=2">
          <img src="images/에코백.webp" alt="캔버스 에코백">
          <h3 class="product-name">캔버스 에코백</h3>
        </a>
        <p class="product-price">12,900원</p>
        <button type="button" class="buy-btn">장바구니 담기</button>
      </div>

      <!-- 상품 3: 텀블러 -->
      <div class="product">
        <a href="product.html?id=3">
          <img src="images/텀블러.webp" alt="스테인리스 텀블러">
          <h3 class="product-name">스테인리스 텀블러</h3>
        </a>
        <p class="product-price">18,500원</p>
        <button type="button" class="buy-btn">장바구니 담기</button>
      </div>

      <!-- 상품 4: 무선 마우스 -->
      <div class="product">
        <a href="product.html?id=4">
          <img src="images/무선마우스.jfif" alt="무선 마우스">
          <h3 class="product-name">무선 마우스</h3>
        </a>
        <p class="product-price">22,000원</p>
        <button type="button" class="buy-btn">장바구니 담기</button>
      </div>

    </div>
  </main>

  <!-- 하단 -->
  <footer class="footer">
    <p>© 2026 적당히 마켓. All rights reserved.</p>
  </footer>

</body>
</html>
