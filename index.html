
<!DOCTYPE html>
<html lang="ko">

  <title>적당히 마켓</title>
  <link rel="stylesheet" href="style.css">

<body>

  <!-- 상단 메뉴 -->
  <header class="header">

      <a href="index.html" class="logo">
<img src="images/logo.png.png" alt="적당히 마켓">
</a>

      <button
        id="menu-btn"
        class="menu-btn"
        type="button"
        aria-label="메뉴 열기"
        aria-expanded="false">
        ☰
      </button>

      <nav id="nav" class="nav">
        <a href="index.html" class="active">홈</a>
        <a href="#products">상품</a>

        <a href="cart.html">장바구니</a>

    </div>
  </header>

      <p class="banner-subtitle">WELCOME TO JEOKDANGHI MARKET</p>

      ✨ 오늘만 이 가격! ✨

  </section>

  <!-- 상품 목록 -->
  <main class="container">
    <h2 class="section-title" id="products">전체 상품</h2>

    <div id="category-list">
      <!-- shop.js가 상품을 자동으로 생성합니다. -->
    </div>

    <!-- 문의 -->
    <section class="contact" id="contact">
      <h2>문의하기</h2>
      <p>문의사항이 있을 시 연락하세요.</p>
      <p class="contact-mail">hello@navar.com</p>
      <p class="contact-mail">369-369-1!2!짝!</p>
    </section>
  </main>

  <!-- 하단 -->
  <footer class="footer">
    <p>© 2026 적당히 마켓. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script src="products.js"></script>
  <script src="shop.js"></script>
